services:
  - type: web
    name: unilearn-pi
    runtime: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php -S 0.0.0.0:$PORT -t public/
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: unilearn-db
          property: externalConnectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_RECAPTCHA_SITE_KEY
        sync: false
      - key: GOOGLE_RECAPTCHA_SECRET_KEY
        sync: false
      - key: MAILER_DSN
        sync: false

  - type: pserv
    name: unilearn-db
    runtime: mysql
    plan: free
